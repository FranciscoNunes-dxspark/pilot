# Pilot's tests on Linux and Windows, for pull requests and pushes to any branch: a branch is checked
# on Windows (the C# inside the PowerShell helpers compiles only there) before it reaches main, where
# every push releases. Paths and line endings must work on both (.gitattributes keeps LF).
name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
